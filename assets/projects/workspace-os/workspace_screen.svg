<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#03050c" />
      <stop offset="45%" stop-color="#080c1e" />
      <stop offset="85%" stop-color="#0b1026" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>

    <!-- Center Ambient Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#080c1e" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141936" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0c1024" stop-opacity="0.9" />
    </linearGradient>

    <!-- Search Bar Gradient -->
    <linearGradient id="searchBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111633" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0e122b" stop-opacity="0.8" />
    </linearGradient>

    <!-- Card Shadow Filter -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .txt-title { font-family: 'Space Grotesk', -apple-system, sans-serif; font-weight: 800; fill: #ffffff; }
    .txt-sub { font-family: 'Inter', -apple-system, sans-serif; font-weight: 400; fill: #94A3B8; }
    .txt-nav { font-family: 'Inter', -apple-system, sans-serif; font-weight: 500; font-size: 15px; fill: #94A3B8; }
    .txt-nav-active { font-family: 'Inter', -apple-system, sans-serif; font-weight: 600; font-size: 15px; fill: #C4B5FD; }
    .txt-tool { font-family: 'Space Grotesk', -apple-system, sans-serif; font-weight: 600; font-size: 16px; fill: #F1F5F9; text-anchor: middle; }
  </style>

  <!-- Background Layer -->
  <rect width="1440" height="900" fill="url(#bgGrad)" />

  <!-- Ambient Glow -->
  <circle cx="720" cy="380" r="500" fill="url(#centerGlow)" />

  <!-- Stars Field -->
  <g fill="#ffffff">
    <circle cx="95" cy="82" r="1" opacity="0.6" />
    <circle cx="160" cy="140" r="1.5" opacity="0.8" />
    <circle cx="230" cy="70" r="0.8" opacity="0.5" />
    <circle cx="310" cy="115" r="1.2" opacity="0.7" />
    <circle cx="420" cy="65" r="1" opacity="0.6" />
    <circle cx="510" cy="130" r="0.8" opacity="0.4" />
    <circle cx="620" cy="75" r="1.6" opacity="0.9" />
    <circle cx="740" cy="110" r="1" opacity="0.5" />
    <circle cx="830" cy="60" r="1.3" opacity="0.8" />
    <circle cx="920" cy="145" r="0.8" opacity="0.4" />
    <circle cx="1020" cy="85" r="1.4" opacity="0.7" />
    <circle cx="1140" cy="120" r="1" opacity="0.6" />
    <circle cx="1260" cy="70" r="1.8" opacity="0.9" />
    <circle cx="1350" cy="135" r="1" opacity="0.5" />

    <circle cx="120" cy="240" r="1.2" opacity="0.6" />
    <circle cx="280" cy="210" r="0.8" opacity="0.4" />
    <circle cx="1180" cy="220" r="1.5" opacity="0.8" />
    <circle cx="1320" cy="250" r="0.9" opacity="0.5" />

    <circle cx="80" cy="390" r="1" opacity="0.5" />
    <circle cx="220" cy="360" r="1.4" opacity="0.7" />
    <circle cx="1240" cy="380" r="1" opacity="0.6" />
    <circle cx="1380" cy="350" r="1.6" opacity="0.8" />

    <circle cx="140" cy="510" r="0.8" opacity="0.4" />
    <circle cx="1300" cy="520" r="1.2" opacity="0.7" />
  </g>

  <!-- Pine Tree Silhouettes at Bottom Edge -->
  <path d="M0,900 L0,840 L25,815 L35,830 L55,795 L70,820 L95,780 L115,810 L140,770 L160,800 L185,765 L205,790 L235,750 L255,780 L285,740 L310,775 L340,735 L365,770 L400,745 L430,780 L460,750 L495,785 L530,760 L570,795 L610,770 L650,800 L690,775 L730,810 L770,780 L810,815 L850,785 L890,820 L930,790 L970,825 L1010,795 L1050,830 L1090,800 L1130,835 L1170,805 L1210,835 L1250,805 L1290,840 L1330,810 L1370,845 L1410,820 L1440,840 L1440,900 Z" fill="#020307" opacity="0.95" />

  <!-- ==================== TOP NAVIGATION BAR ==================== -->
  <g transform="translate(60, 36)">
    <!-- Logo -->
    <text x="0" y="24" class="txt-title" font-size="22" letter-spacing="0.02em">WorkSpace.OS</text>

    <!-- Nav Links Center -->
    <g transform="translate(480, 0)">
      <!-- Active Home pill -->
      <rect x="-16" y="2" width="76" height="30" rx="15" fill="#8B5CF6" fill-opacity="0.16" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1" />
      <text x="22" y="22" class="txt-nav-active" text-anchor="middle">Home</text>
      <text x="105" y="22" class="txt-nav">Tools</text>
      <text x="185" y="22" class="txt-nav">Notes</text>
      <text x="265" y="22" class="txt-nav">Focus</text>
      <text x="345" y="22" class="txt-nav">More</text>
    </g>

    <!-- Right Controls -->
    <g transform="translate(1220, 6)" stroke="#94A3B8" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <!-- Sun/Cloud Weather Icon -->
      <g transform="translate(0, 0)">
        <path d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" />
        <path d="M8 1v2M8 13v2M1.6 4.6l1.4 1.4M13 4.6l-1.4 1.4" />
      </g>
      <!-- Clock Icon -->
      <g transform="translate(45, 0)">
        <circle cx="8" cy="8" r="7" />
        <polyline points="8 4 8 8 11 9.5" />
      </g>
      <!-- Profile Icon -->
      <g transform="translate(90, 0)">
        <circle cx="8" cy="8" r="7" />
        <path d="M3.5 13a5 5 0 0 1 9 0" />
        <circle cx="8" cy="6" r="2.5" />
      </g>
    </g>
  </g>

  <!-- ==================== CENTER HERO CONTENT ==================== -->
  <g transform="translate(720, 205)" text-anchor="middle">
    <!-- Big Title -->
    <text x="0" y="0" class="txt-title" font-size="58" letter-spacing="-0.02em">WorkSpace.OS</text>

    <!-- Subtitle -->
    <text x="0" y="44" class="txt-sub" font-size="17">A personal digital workspace for your tools and ideas.</text>

    <!-- Search Bar -->
    <g transform="translate(-320, 75)" text-anchor="start">
      <rect x="0" y="0" width="640" height="52" rx="12" fill="url(#searchBg)" stroke="#8B5CF6" stroke-opacity="0.32" stroke-width="1.2" filter="url(#cardShadow)" />
      <text x="24" y="32" font-family="'Inter', sans-serif" font-size="15" fill="#64748B">Search tools, resources...</text>
      <!-- Search Magnifier Icon -->
      <g transform="translate(596, 17)" stroke="#8B5CF6" stroke-width="2" fill="none" stroke-linecap="round">
        <circle cx="7" cy="7" r="6" />
        <line x1="12" y1="12" x2="16" y2="16" />
      </g>
    </g>
  </g>

  <!-- ==================== 10 TOOLS GRID (2 ROWS OF 5) ==================== -->
  <!-- Row 1: y = 430 -->
  <g transform="translate(180, 430)">

    <!-- 1. Google -->
    <g transform="translate(0, 0)" filter="url(#cardShadow)">
      <rect width="196" height="135" rx="16" fill="url(#cardBg)" stroke="#8B5CF6" stroke-opacity="0.22" stroke-width="1.2" />
      <g transform="translate(78, 26)">
        <path fill="#EA4335" d="M20 7.9c2.9 0 5.5 1 7.6 3l5.7-5.7C29.8 2.1 25.2 0 20 0 12.2 0 5.5 4.5 2.3 11.1l6.6 5.1C10.4 11.2 14.8 7.9 20 7.9z"/>
        <path fill="#4285F4" d="M39.1 20.4c0-1.3-.1-2.6-.3-3.8H20v7.5h10.8c-.5 2.5-1.9 4.6-4 6l6.3 4.9c3.7-3.4 6-8.4 6-14.6z"/>
        <path fill="#FBBC05" d="M8.9 23.8c-.4-1.3-.7-2.6-.7-3.8s.3-2.6.7-3.8l-6.6-5.1C.8 13.6 0 16.7 0 20s.8 6.4 2.3 8.9l6.6-5.1z"/>
        <path fill="#34A853" d="M20 40c5.4 0 9.9-1.8 13.2-4.9l-6.3-4.9c-1.8 1.2-4.1 2-6.9 2-5.2 0-9.6-3.3-11.1-8.3l-6.6 5.1C5.5 35.5 12.2 40 20 40z"/>
      </g>
      <text x="98" y="105" class="txt-tool">Google</text>
    </g>

    <!-- 2. YouTube -->
    <g transform="translate(220, 0)" filter="url(#cardShadow)">
      <rect width="196" height="135" rx="16" fill="url(#cardBg)" stroke="#8B5CF6" stroke-opacity="0.22" stroke-width="1.2" />
      <g transform="translate(76, 26)">
        <path fill="#FF0000" d="M41.7 12.5c-.5-1.8-1.9-3.2-3.7-3.7-3.3-.9-16.5-.9-16.5-.9s-13.2 0-16.5.9c-1.8.5-3.2 1.9-3.7 3.7C.4 15.8.4 21.7.4 21.7s0 5.9.9 9.2c.5 1.8 1.9 3.2 3.7 3.7 3.3.9 16.5.9 16.5.9s13.2 0 16.5-.9c1.8-.5 3.2-1.9 3.7-3.7.9-3.3.9-9.2.9-9.2s0-5.9-.9-9.2z"/>
        <polygon fill="#FFF" points="17.4,15.7 28.8,21.7 17.4,27.7"/>
      </g>
      <text x="98" y="105" class="txt-tool">YouTube</text>
    </g>

    <!-- 3. ChatGPT -->
    <g transform="translate(440, 0)" filter="url(#cardShadow)">
      <rect width="196" height="135" rx="16" fill="url(#cardBg)" stroke="#8B5CF6" stroke-opacity="0.22" stroke-width="1.2" />
      <g transform="translate(78, 25)">
        <circle cx="20" cy="20" r="19" fill="#10a37f" />
        <path fill="#fff" d="M20 12.5a4 4 0 0 1 3.5 2l1.3-.8a5.5 5.5 0 0 0-4.8-2.7c-2 0-3.8 1.1-4.7 2.8l1.3.8a4 4 0 0 1 3.4-2.1zm5.2 4.2a4 4 0 0 1 1 3.9l1.5.3a5.5 5.5 0 0 0-1.4-5.4l-1.1 1.2zm-10.4 0l-1.1-1.2a5.5 5.5 0 0 0-1.4 5.4l1.5-.3a4 4 0 0 1 1-3.9zm1 7.8l-1.3.8a5.5 5.5 0 0 0 4.8 2.7c2 0 3.8-1.1 4.7-2.8l-1.3-.8a4 4 0 0 1-6.9 0l-1.3.1zm8.4-3.9a4 4 0 0 1-1 3.9l1.1 1.2a5.5 5.5 0 0 0 1.4-5.4l-1.5.3z" />
      </g>
      <text x="98" y="105" class="txt-tool">ChatGPT</text>
    </g>

    <!-- 4. Notion -->
    <g transform="translate(660, 0)" filter="url(#cardShadow)">
      <rect width="196" height="135" rx="16" fill="url(#cardBg)" stroke="#8B5CF6" stroke-opacity="0.22" stroke-width="1.2" />
      <g transform="translate(78, 25)">
        <rect width="40" height="40" rx="8" fill="#FFFFFF" />
        <path fill="#000000" d="M12 9l19-1.5c1.2 0 1.8.6 2 1.5l1.5 21c.2 1.2-.4 1.8-1.5 2L14 33.5c-1.2 0-1.8-.6-2-1.5L10.5 11c-.2-1.2.4-1.8 1.5-2zm4.5 4.5v13.5l3.2-.3v-10l6.2 10.3 3.5-.3V13.2l-3.2.3v9.5l-6.2-9.8-3.5.3z"/>
      </g>
      <text x="98" y="105" class="txt-tool">Notion</text>
    </g>

    <!-- 5. GitHub -->
    <g transform="translate(880, 0)" filter="url(#cardShadow)">
      <rect width="196" height="135" rx="16" fill="url(#cardBg)" stroke="#8B5CF6" stroke-opacity="0.22" stroke-width="1.2" />
      <g transform="translate(78, 25)">
        <circle cx="20" cy="20" r="20" fill="#ffffff" />
        <path fill="#0d1117" fill-rule="evenodd" d="M20 2C10.1 2 2 10.1 2 20c0 7.9 5.1 14.6 12.2 17 1 .2 1.3-.4 1.3-.9v-3.5c-5 .9-6-2.4-6-2.4-.8-2-2-2.6-2-2.6-1.6-1.1.1-1.1.1-1.1 1.8.1 2.8 1.8 2.8 1.8 1.6 2.7 4.2 1.9 5.2 1.5.2-1.2.6-1.9 1.1-2.4-4-.5-8.2-2-8.2-8.9 0-2 .7-3.6 1.8-4.8-.2-.5-.8-2.3.2-4.7 0 0 1.5-.5 4.9 1.8 1.4-.4 3-.6 4.5-.6s3.1.2 4.5.6c3.4-2.3 4.9-1.8 4.9-1.8 1 2.4.4 4.2.2 4.7 1.1 1.2 1.8 2.8 1.8 4.8 0 6.9-4.2 8.4-8.2 8.9.6.5 1.2 1.6 1.2 3.3v4.9c0 .5.4 1.1 1.3.9C32.9 34.6 38 27.9 38 20c0-9.9-8.1-18-18-18z"/>
      </g>
      <text x="98" y="105" class="txt-tool">GitHub</text>
    </g>

  </g>

  <!-- Row 2: y = 585 -->
  <g transform="translate(180, 585)">

    <!-- 6. Drive -->
    <g transform="translate(0, 0)" filter="url(#cardShadow)">
      <rect width="196" height="135" rx="16" fill="url(#cardBg)" stroke="#8B5CF6" stroke-opacity="0.22" stroke-width="1.2" />
      <g transform="translate(78, 25)">
        <path d="M4 31l2.5 4.5c.5.9 1.3 1.6 2.2 2.1l9.2-16H4c0 1 .3 2.1.8 3l-.8 6.4z" fill="#0066da"/>
        <path d="M20 12l-9.2-16c-.9.5-1.7 1.2-2.2 2.1L.8 15c-.5.9-.8 2-.8 3h18.4L20 12z" fill="#00ac47"/>
        <path d="M30 37.6c.9-.5 1.7-1.2 2.2-2.1l6.7-11.6c.5-.9.8-2 .8-3H21.3l8.7 16.7z" fill="#ea4335"/>
        <path d="M20 12l9.2-16c-.9-.5-1.9-.8-3-.8h-12.4c-1.1 0-2.1.3-3 .8L20 12z" fill="#00832d"/>
        <path d="M27 25.6H9.3l-9.2 16c.9.5 1.9.8 3 .8h33.9c1.1 0 2.1-.3 3-.8L27 25.6z" fill="#2684fc"/>
        <path d="M33 15l-8.5-14.7c-.5-.9-1.3-1.6-2.2-2.1L13.1 14.2l10.8 18.7h18.3c0-1-.3-2.1-.8-3L33 15z" fill="#ffba00"/>
      </g>
      <text x="98" y="105" class="txt-tool">Drive</text>
    </g>

    <!-- 7. Gmail -->
    <g transform="translate(220, 0)" filter="url(#cardShadow)">
      <rect width="196" height="135" rx="16" fill="url(#cardBg)" stroke="#8B5CF6" stroke-opacity="0.22" stroke-width="1.2" />
      <g transform="translate(78, 27)">
        <path fill="#4285f4" d="M3 34h8V16L0 8v22c0 2.2 1.8 4 4 4z"/>
        <path fill="#34a853" d="M37 34h8c2.2 0 4-1.8 4-4V8l-12 8z"/>
        <path fill="#fbbc04" d="M37 2v14l12-8v-3c0-4.6-5.3-7.2-9-4.5z"/>
        <path fill="#ea4335" d="M11 16V2l13 10 13-10v14L24 26z"/>
        <path fill="#c5221f" d="M0 5v3l11 8V2L8.5.5C4.8-2.3 0 .3 0 5z"/>
      </g>
      <text x="98" y="105" class="txt-tool">Gmail</text>
    </g>

    <!-- 8. LinkedIn -->
    <g transform="translate(440, 0)" filter="url(#cardShadow)">
      <rect width="196" height="135" rx="16" fill="url(#cardBg)" stroke="#8B5CF6" stroke-opacity="0.22" stroke-width="1.2" />
      <g transform="translate(78, 25)">
        <rect width="40" height="40" rx="8" fill="#0A66C2"/>
        <circle cx="11" cy="11" r="3.5" fill="#FFF"/>
        <rect x="7.5" y="17" width="7" height="16" fill="#FFF"/>
        <path fill="#FFF" d="M18.5 17H25v2.4c1-1.5 3-2.8 5.8-2.8 5.3 0 6.5 3.5 6.5 8.1V33h-6.5V25.5c0-2-.4-3.5-2.6-3.5s-3 1.5-3 3.5V33h-6.7z"/>
      </g>
      <text x="98" y="105" class="txt-tool">LinkedIn</text>
    </g>

    <!-- 9. Canva -->
    <g transform="translate(660, 0)" filter="url(#cardShadow)">
      <rect width="196" height="135" rx="16" fill="url(#cardBg)" stroke="#8B5CF6" stroke-opacity="0.22" stroke-width="1.2" />
      <g transform="translate(78, 25)">
        <circle cx="20" cy="20" r="19" fill="#00C4CC"/>
        <path fill="#ffffff" d="M18 24.5c-1.5 0-2.5-.8-3-2l-.2.1c-.2 1.2-.8 1.8-1.8 1.8-1.2 0-1.8-.8-1.8-2.1 0-2.7 2.8-5.8 5.5-5.8 1.6 0 2.7 1 2.7 2.6 0 1.9-1 5.3-1.4 5.4z"/>
      </g>
      <text x="98" y="105" class="txt-tool">Canva</text>
    </g>

    <!-- 10. Figma -->
    <g transform="translate(880, 0)" filter="url(#cardShadow)">
      <rect width="196" height="135" rx="16" fill="url(#cardBg)" stroke="#8B5CF6" stroke-opacity="0.22" stroke-width="1.2" />
      <g transform="translate(86, 25)">
        <path fill="#1abcfe" d="M12 18a6 6 0 1 1 12 0 6 6 0 0 1-12 0z"/>
        <path fill="#0acf83" d="M0 30a6 6 0 0 1 6-6h6v6a6 6 0 1 1-12 0z"/>
        <path fill="#ff7262" d="M12 0v12h6a6 6 0 1 0 0-12z"/>
        <path fill="#f24e1e" d="M0 6a6 6 0 0 0 6 6h6V0H6a6 6 0 0 0-6 6z"/>
        <path fill="#a259ff" d="M0 18a6 6 0 0 0 6 6h6V12H6a6 6 0 0 0-6 6z"/>
      </g>
